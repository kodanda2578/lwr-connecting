# Laughs With Ramesh Connecting Backend Application Configuration

server.port=8080
server.servlet.context-path=/api

# ============================================================
# DATABASE CONFIGURATION
# PostgreSQL / H2 Local Fallback
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lwr_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# JWT SECURITY
# ============================================================

jwt.secret=${JWT_SECRET:lwr_connecting_super_secret_jwt_signing_key_2026_production_grade}
jwt.expiration-ms=86400000

# ============================================================
# AI PROVIDER
# ============================================================

ai.provider=${AI_PROVIDER:GEMINI}
ai.api-key=${GEMINI_API_KEY:mock_development_key}

# ============================================================
# EMAIL / SMTP
# ============================================================

# Real Gmail SMTP
email.provider=${EMAIL_PROVIDER:SMTP}
email.from=${EMAIL_FROM:no-reply@lwrconnecting.com}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${SMTP_PASSWORD:${SPRING_MAIL_PASSWORD:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# ============================================================
# ADMIN ACCOUNT INITIAL SEED
# ============================================================

admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
admin.email=${ADMIN_EMAIL:admin@lwrconnecting.com}
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:Admin@LWR2026!}
admin.full-name=${ADMIN_FULL_NAME:Ramesh Admin}