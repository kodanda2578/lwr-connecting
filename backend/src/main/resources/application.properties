# Laughs With Ramesh Connecting Backend Application Configuration

server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================================
# DATABASE CONFIGURATION
# PostgreSQL / H2 Local Fallback
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lwr_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ============================================================
# JPA / HIBERNATE
# ============================================================

# Hibernate automatically detects H2Dialect for H2 or PostgreSQLDialect for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Disable schema.sql auto-init: schema.sql is a stale PostgreSQL reference DDL.
# Hibernate manages the actual H2 schema via ddl-auto=update.
spring.sql.init.mode=never

# ============================================================
# CORS & FRONTEND ORIGIN CONFIGURATION
# ============================================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# ============================================================
# JWT SECURITY
# ============================================================

jwt.secret=${JWT_SECRET:lwr_connecting_super_secret_jwt_signing_key_2026_production_grade}
jwt.expiration-ms=86400000

# ============================================================
# AI PROVIDER
# ============================================================

ai.provider=${AI_PROVIDER:GEMINI}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.timeout.seconds=${GEMINI_TIMEOUT_SECONDS:30}

# ============================================================
# EMAIL / SMTP
# ============================================================

# Real Gmail SMTP (configured via SMTP_USERNAME and SMTP_PASSWORD / Google App Password)
email.provider=${EMAIL_PROVIDER:SMTP}
email.from=${EMAIL_FROM:${SMTP_USERNAME:${spring.mail.username:no-reply@lwrconnecting.com}}}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${SMTP_PASSWORD:${SPRING_MAIL_PASSWORD:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=${SMTP_DEBUG:false}

# ============================================================
# ADMIN ACCOUNT INITIAL SEED
# ============================================================

admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
admin.email=${ADMIN_EMAIL:admin@lwrconnecting.com}
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:Admin@LWR2026!}
admin.full-name=${ADMIN_FULL_NAME:Ramesh Admin}