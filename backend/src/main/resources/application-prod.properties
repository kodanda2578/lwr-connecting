# ============================================================
# LWR CONNECTING — PRODUCTION PROFILE CONFIGURATION (Render / Cloud)
# Activate via environment variable: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# Dynamic Port Binding for Render ($PORT)
server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================================
# MANAGED POSTGRESQL DATABASE CONFIGURATION
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# Hibernate auto-detects PostgreSQLDialect from DataSource URL
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never

# ============================================================
# JWT SECURITY
# In production, JWT_SECRET must be supplied via environment
# ============================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# ============================================================
# CORS & FRONTEND ORIGIN CONFIGURATION
# Supports Vercel production and preview deployments
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lwrconnecting.com,https://*.vercel.app}
app.frontend.url=${APP_FRONTEND_URL:https://lwrconnecting.com}

# ============================================================
# AI PROVIDER (Gemini API)
# ============================================================
ai.provider=${AI_PROVIDER:GEMINI}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.timeout.seconds=${GEMINI_TIMEOUT_SECONDS:30}

# ============================================================
# EMAIL / SMTP (Real Gmail SMTP configured via environment)
# ============================================================
email.provider=${EMAIL_PROVIDER:SMTP}
email.from=${EMAIL_FROM:${SMTP_USERNAME:no-reply@lwrconnecting.com}}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false

# ============================================================
# ADMIN SEEDING
# ============================================================
admin.seed.enabled=${ADMIN_SEED_ENABLED:false}
admin.email=${ADMIN_EMAIL:admin@lwrconnecting.com}
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}
admin.full-name=${ADMIN_FULL_NAME:Ramesh Admin}


exam.seed.enabled=${EXAM_SEED_ENABLED:false}
college.ingestion.enabled=${COLLEGE_INGESTION_ENABLED:false}
